name: Claude Code Review

# Runs an AI review pass on every pull request diff. The bot posts its findings
# as PR comments; a human still reads, accepts/rejects each, and merges.
#
# Requires repository secret ANTHROPIC_API_KEY (Settings → Secrets and variables
# → Actions). Remove or disable this workflow if the secret is not configured.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write   # required by claude-code-action to mint a GitHub token via OIDC

jobs:
  review:
    name: AI code review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the workflow's built-in token so the action does not require the
          # Claude Code GitHub App to be installed on the repo.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Grant the tools needed to actually post feedback on the PR. Without
          # these the agent runs but cannot comment, so the job goes green silent.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            Repo: ${{ github.repository }}
            PR number: ${{ github.event.pull_request.number }}

            Review the pull request diff for this bus-management app. Focus on
            correctness of the domain core: atomic seat reservation (no
            read-then-write, seats_left never negative), payment webhook
            idempotency and seat restoration on failure, order-status
            transitions, and RBAC enforcement on protected endpoints. Also flag
            missing tests for changed domain logic and any lint/type issues.

            For each concrete issue, leave an inline comment on the relevant line
            using mcp__github_inline_comment__create_inline_comment. Then always
            post one summary comment on the PR with `gh pr comment` — list the
            findings, or state that no issues were found. Skip praise.
