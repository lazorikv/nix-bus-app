name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bus
          POSTGRES_PASSWORD: bus
          POSTGRES_DB: bus_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bus -d bus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Tests with coverage
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://bus:bus@localhost:5433/bus_test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check & build
        run: npm run build

  review:
    name: AI code review
    # Gate the (billed) Claude review on green CI: it runs only after both
    # backend and frontend jobs pass, and only for pull requests.
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Built-in token so the action does not require the Claude GitHub App.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 30
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            Repo: ${{ github.repository }}
            PR number: ${{ github.event.pull_request.number }}

            Review the pull request diff for this bus-management app. Focus on
            correctness of the domain core: atomic seat reservation (no
            read-then-write, seats_left never negative), payment webhook
            idempotency and seat restoration on failure, order-status
            transitions, and RBAC enforcement on protected endpoints. Also flag
            missing tests for changed domain logic and any lint/type issues.

            For each concrete issue, leave an inline comment on the relevant line
            using mcp__github_inline_comment__create_inline_comment. Then always
            post one summary comment on the PR with `gh pr comment` — list the
            findings, or state that no issues were found. Skip praise.
