services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bus
      POSTGRES_PASSWORD: bus
      POSTGRES_DB: bus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bus -d bus"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://bus:bus@db:5432/bus
      JWT_SECRET: change-me-in-production
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: bus-photos
      S3_REGION: us-east-1
      FIRST_ADMIN_EMAIL: admin@busapp.com
      FIRST_ADMIN_PASSWORD: admin12345
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      # Baked into the static build at image-build time (see frontend/Dockerfile).
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"

volumes:
  pgdata:
  miniodata:
